name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run pyright
      - run: uv run pytest

  # Installs the lowest version that pyproject.toml allows of each direct dependency, so the
  # lower bounds stay true. The sync resolves again and rewrites uv.lock in the runner's checkout
  # only, and --no-sync keeps `uv run` from resolving back to the locked versions.
  lowest-direct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --resolution lowest-direct
      - run: uv run --no-sync pytest
